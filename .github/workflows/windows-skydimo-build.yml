name: Build Skydimowindows (Windows installer)

# Skydimo branding patch: a manually-triggered, Windows-only build for this
# personal fork. The actual app/product name is "Skydimowindows" (not plain
# "Skydimo") because the maintainer has a separate, unrelated app also named
# Skydimo, and the two would otherwise collide (same install folder, Start
# Menu entry, config directory). See BRANDING.md for what's rebranded and
# why, and flutter-build.yml's `windows_only` input for how the shared build
# is scoped down to just the Windows Flutter job for this.

on:
  workflow_dispatch:

jobs:
  run-windows-skydimo-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "skydimowindows"
      publish-update-metadata: false
      windows_only: true
